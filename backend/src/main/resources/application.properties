spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/e-procurement}
spring.datasource.username=${DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:}

# --- CONFIGURATION HIBERNATE & FLYWAY ---
# Flyway reste désactivé tant que l'historique et le schéma existant ne sont pas réconciliés.
spring.flyway.enabled=false
# Aucun changement de schéma implicite au démarrage.
spring.jpa.hibernate.ddl-auto=none

# Afficher le SQL généré par Hibernate pour faciliter le diagnostic.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ----------------------------------------

spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=false

server.port=8080
server.compression.enabled=true
server.compression.min-response-size=1024

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

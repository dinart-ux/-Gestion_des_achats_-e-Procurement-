spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/e-procurement}
spring.datasource.username=${DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:}

# --- CONFIGURATION HIBERNATE & FLYWAY ---
# Activer après baseline/réconciliation explicite d'une base existante.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
# Aucun changement de schéma implicite au démarrage.
spring.jpa.hibernate.ddl-auto=none
app.security.auth-state.enabled=${AUTH_STATE_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false
app.mail.from=${MAIL_FROM:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Afficher le SQL généré par Hibernate pour faciliter le diagnostic.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ----------------------------------------

spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=false

server.port=8080
server.compression.enabled=true
server.compression.min-response-size=1024

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
